name: apk

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/vidro.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: launcher/app/build/outputs/apk/release/*.apk

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk vidro.apk
          if ! gh release view apk-teste >/dev/null 2>&1; then
            gh release create apk-teste --prerelease --title "apk" --notes "" --target "${{ github.sha }}"
          fi
          gh release upload apk-teste vidro.apk --clobber
